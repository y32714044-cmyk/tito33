<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITO STORE</title>

  <style>
    /* ===== الخلفية الداكنة الفخمة ===== */
    body {
      background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 45%, #000000 100%);
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      color: #fff;
      font-family: 'Arial', sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 100%, rgba(255,255,255,0.03) 0%, transparent 70%);
    }

    /* إزالة أي جرافيتي أو خرسانة أو تكستشر */
    .graffiti, .concrete-texture, .rough-texture, .noise-overlay,
    .texture-bg, [class*="graffiti"], [class*="concrete"], [class*="texture"] {
      background: transparent !important;
      background-image: none !important;
      opacity: 0 !important;
      display: none !important;
    }

    header, nav, main, section, footer, .container, .content {
      position: relative;
      z-index: 1;
    }

    /* ===== تخطيط الصفحة ===== */
    .store-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .store-logo {
      font-size: 38px;
      letter-spacing: 8px;
      font-weight: 700;
      margin-bottom: 40px;
      color: #fff;
    }

    .hoodie-image {
      max-width: 100%;
      width: 420px;
      border-radius: 12px;
      margin: 20px auto;
      display: block;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .price {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 25px 0 10px;
      color: #fff;
    }

    .buttons-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    /* ===== الزراير ===== */
    .whatsapp-btn,
    .hoodie-btn,
    .instagram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 30px;
      background: linear-gradient(145deg, #1a1a1a, #000);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .whatsapp-btn:hover,
    .hoodie-btn:hover,
    .instagram-btn:hover {
      background: linear-gradient(145deg, #2a2a2a, #111);
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    .whatsapp-btn:hover { border-color: rgba(37, 211, 102, 0.5); }
    .instagram-btn:hover { border-color: rgba(225, 48, 108, 0.6); }

    /* ===== صفحة إنستجرام (اختياري) ===== */
    .instagram-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      color: #fff;
    }
    .instagram-page h1 { font-size: 42px; letter-spacing: 4px; margin-bottom: 10px; }
    .insta-handle { font-size: 20px; color: #b0b0b0; margin-bottom: 20px; direction: ltr; }
    .insta-desc { font-size: 16px; color: #888; max-width: 400px; line-height: 1.8; margin-bottom: 40px; }

    .instagram-btn-large {
      display: inline-flex;
      align-items: center;
      padding: 18px 40px;
      background: linear-gradient(145deg, #1a1a1a, #000);
      color: #fff;
      border: 1px solid rgba(225, 48, 108, 0.4);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }
    .instagram-btn-large:hover {
      background: linear-gradient(145deg, #2a2a2a, #111);
      border-color: rgba(225, 48, 108, 0.9);
      box-shadow: 0 0 30px rgba(225, 48, 108, 0.2);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <!-- ===== الصفحة الرئيسية ===== -->
  <main class="store-container">

    <!-- اللوجو (غيّر النص لو عايز) -->
    <h1 class="store-logo">TITO STORE</h1>

    <!-- صورة الهودي (حط مسار الصورة بتاعتك هنا) -->
    <img src="hoodie.jpg" alt="TITO STORE Hoodie" class="hoodie-image">

    <!-- السعر -->
    <p class="price">600 EGP</p>

    <!-- الزراير -->
    <div class="buttons-row">

      <!-- زرار الهودي -->
      <button onclick="showSizePrompt()" class="hoodie-btn">
        اطلب الهودي
      </button>

      <!-- زرار واتساب -->
      <a href="https://wa.me/201551919495?text=مرحبا%20عايز%20أستفسر%20عن%20الهودي" 
         target="_blank" 
         class="whatsapp-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-left:8px;">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        تواصل واتساب
      </a>

      <!-- زرار إنستجرام -->
      <a href="https://instagram.com/Tito__store99" 
         target="_blank" 
         rel="noopener noreferrer"
         class="instagram-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-left:8px;">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        Tito__store99
      </a>

    </div>
  </main>

  <!-- ===== JavaScript ===== -->
  <script>
    function showSizePrompt() {
      const size = prompt("ادخل المقاس اللي تحتاجه (S / M / L / XL / XXL):");
      
      if (size && size.trim() !== "") {
        const message = encodeURIComponent(
          "مرحبا، عايز أطلب الهودي بمقاس: " + size.trim() + "\nالسعر: 600 EGP"
        );
        window.open("https://wa.me/201551919495?text=" + message, "_blank");
      }
    }
  </script>

</body>
</html>
